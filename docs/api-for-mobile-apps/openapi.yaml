      summary: Detail slip gaji (jalur permission, bukan jalur PIN)
      description: |
        Sumber: `payroll.routes.ts:391-397`,
        `payroll.controller.ts:342-353`.
        **Permission: `payroll:read`.**

        Bila pemanggil punya `employeeId` dan tidak elevated, header
        `X-Payroll-Unlock-Token` wajib; tanpa itu jawabannya
        `401 PAYROLL_UNLOCK_REQUIRED`
        (`payroll-unlock.service.ts:24`). Setiap akses dicatat audit
        (`auditView` `VIEW_PAYSLIP`).

        Aplikasi mobile karyawan sebaiknya memakai
        `GET /payroll/payslips/my/{id}` dengan PIN.
      parameters:
        - $ref: '#/components/parameters/PayslipIdPath'
        - $ref: '#/components/parameters/XPayrollUnlockToken'
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401':
          description: |
