  /employees/{id}:
    get:
      tags: [employee]
      operationId: employeeGetById
      summary: Detail karyawan (PII di-mask kecuali punya employee:read-sensitive)
      description: |
        Sumber: `employee.routes.ts:85`,
        `backend/src/modules/employee/employee-pii.ts`.
        **Permission: `employee:read`.**

        **Masking PII.** Enam field di-mask menjadi "bintang + 4 karakter
        terakhir" kecuali pemanggil berhak membaca mentah
        (`employee-pii.ts:10-17`, `29-32`):
        `idNumber` (NIK), `taxId` (NPWP), `bankAccount`,
        `bankAccountHolder`, `bpjsKetenagakerjaan`, `bpjsKesehatan`.

        Format mask persis: `'*'.repeat(len - 4) + nilai.slice(-4)` untuk
        panjang > 4, dan `'****'` (tepat empat bintang) untuk panjang <= 4.
        Jadi NIK 16 digit `3174010101900001` menjadi
        `************0001` — **panjang string tetap sama**, sehingga jangan
        dipakai untuk validasi, perhitungan, atau dikirim balik sebagai nilai
        asli. Field bernilai `null` tetap `null` (tidak di-mask).

        Siapa yang boleh baca mentah (`employee-pii.ts:21-27`): role
        `SUPER_ADMIN`, `GROUP_ADMIN`, `COMPANY_ADMIN`, `HR_MANAGER`,
        `HR_STAFF`, **atau** permission `employee:read-sensitive` /
        `employee:*`. Aplikasi bisa memeriksanya dari
        `GET /auth/me` → `data.permissions` / `data.roles`, dan menampilkan
        label "disamarkan" bila tidak berhak.
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Detail karyawan, PII mungkin ter-mask.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EmployeeWithMaskablePii' }
              examples:
                terMask:
                  summary: Pemanggil tanpa employee:read-sensitive
                  value:
                    success: true
                    message: Success
                    data:
                      id: 22222222-2222-2222-2222-222222222222
                      fullName: Budi Santoso
                      idNumber: "************0001"
                      taxId: "***********1234"
                      bankAccount: "*******5678"
                      bpjsKesehatan: "*********4321"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

