        `id` divalidasi UUID. Mendukung `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/PathIdUuid'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ==================================================================
  # DAILY ACTIVITY
  # ==================================================================
  /daily-activities/my:
    get:
      tags: [daily-activity]
      operationId: dailyActivityListMine
      summary: Laporan aktivitas harian saya
      description: |
        Sumber:
        `backend/src/modules/daily-activity/daily-activity.routes.ts:27-30`.
        **Tidak ada `authorize()`** — komentar di
        `daily-activity.routes.ts:23-26` menjelaskan controller men-scope
        ketat ke `employeeId` pemanggil. Tidak ada `validate()` untuk query.
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /daily-activities:
    post:
      tags: [daily-activity]
      operationId: dailyActivityCreate
      summary: Kirim laporan aktivitas harian (dengan GPS)
      description: |
        Sumber: `daily-activity.routes.ts:31-38`,
        `backend/src/modules/daily-activity/daily-activity.dto.ts:13-30`.
        **Permission: `daily-activity:create`.** `daily-activity` tidak ada
        di tabel alias legacy (`Authorize.ts:12-18`), jadi yang dicek persis
        `daily-activity:create` atau `daily-activity:*`. Nama `da:create`
        yang muncul di `docs/mobile-permission-matrix.md` adalah kolom `code`
        di tabel permission (`01-permissions.seed.ts:143`); token membawa
        bentuk `resource:action` (`auth.service.ts:60-68`), bukan `code`,
        sehingga keduanya tetap cocok di server.

        `latitude` dan `longitude` wajib. Mendukung `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDailyActivityRequest' }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /daily-activities/{id}/complete:
    post:
      tags: [daily-activity]
      operationId: dailyActivityComplete
      summary: Tandai aktivitas harian selesai
      description: |
        Sumber: `daily-activity.routes.ts:52-59`,
        `daily-activity.dto.ts:40-43`.
        **Permission: `daily-activity:update`.** Mendukung `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteDailyActivityRequest' }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ==================================================================
  # META
  # ==================================================================
  /meta/endpoints:
    get:
      tags: [meta]
      operationId: metaListEndpoints
      summary: Inventaris seluruh route server (admin)
      description: |
        Sumber: `backend/src/app.ts:249-258`.
        **Permission: `rbac:read`.**

        Endpoint ini ada dan memang berguna untuk tim integrasi, tetapi
        **admin-gated**: komentar di `app.ts:245-246` menyatakan peta
        permukaan API tidak boleh publik. Akun karyawan biasa akan
        mendapat `403 FORBIDDEN`.

        Response **bukan** envelope `Result` biasa — controller-nya menulis
        `{ success: true, data: { count, endpoints } }` secara langsung, jadi
        tidak ada field `message` (`app.ts:256`).

        Pendamping: `GET /meta/openapi.json` (`app.ts:263-275`) mengembalikan
        dokumen OpenAPI 3.1 yang dibuat dari router Express saat request,
        dengan permission yang sama.
      responses:
        '200':
          description: Inventaris endpoint, diurutkan menurut `path`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetaEndpointsResponse' }
              example:
                success: true
                data:
                  count: 2
                  endpoints:
                    - path: /api/v1/attendance/me/today
                      methods: [GET]
                      middlewares: [authenticate, anonymous]
                    - path: /api/v1/auth/login
                      methods: [POST]
                      middlewares: [anonymous]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN` — butuh `rbac:read`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /meta/openapi.json:
    get:
      tags: [meta]
      operationId: metaGetOpenApiDocument
      summary: Dokumen OpenAPI 3.1 yang dibuat server saat request (admin)
      description: |
        Sumber: `app.ts:263-275`,
        `backend/src/shared/openapi/generate.ts`.
        **Permission: `rbac:read`.**

        Dokumen ini diturunkan dari router yang hidup, jadi tidak bisa
        melenceng dari server. Setiap operasi membawa path/method asli,
        skema request hasil konversi dari Zod,
        `x-query-schema` / `x-path-schema`, `x-required-permissions` dari
        guard `authorize()`, dan `security: bearerAuth` bila route
        terautentikasi. Bentuk response hanya dideskripsikan sebagai envelope
        bersama.

        Pakai ini untuk memverifikasi bahwa file `openapi.yaml` ini masih
        sinkron dengan server.
      responses:
        '200':
          description: Dokumen OpenAPI (bukan envelope `Result`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN` — butuh `rbac:read`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

components:

  # ------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT HS256 yang didapat dari `POST /auth/login`
        (dengan `X-Client-Type: mobile`) atau `POST /auth/refresh`.

        Kirim sebagai `Authorization: Bearer <accessToken>`.

        Cara server membacanya (`backend/src/shared/middleware/Authenticate.ts:23-34`):
        cookie `at` diperiksa **lebih dulu**, baru header
        `Authorization`. Format header harus tepat dua bagian dipisah satu
        spasi, dengan skema `Bearer` (case-sensitive) — `bearer` huruf kecil
        tidak diterima.

        Klaim token (`backend/src/shared/security/JWTHandler.ts:92-119`):
        `sub`, `email`, `sessionVersion`, `employeeId`, `companyId`,
        `companyScope`, `groupId`, `permissions`, `roles`, `hasGlobalRole`,
        `maxRolePriority`, `type: 'access'`, `iss` (env `JWT_ISSUER`),
        `aud: 'hrms-api'`.

        Masa hidup default: access token `15m`, refresh token `7d`
        (`backend/src/config/index.ts:54-55`). Nilai pastinya ada di
        `data.tokens.expiresIn` (detik) pada response login/refresh — pakai
        itu, jangan hardcode.

  # ------------------------------------------------------------------
  parameters:
    XClientType:
      name: X-Client-Type
      in: header
      required: false
      schema:
        type: string
        enum: [mobile]
      description: |
        Kirim `mobile` agar token dikembalikan di body response dan tidak ada
        cookie auth yang di-set. Dibandingkan setelah di-lowercase
        (`backend/src/modules/auth/auth.controller.ts:70`), jadi `Mobile`
        atau `MOBILE` juga bekerja. Hanya berpengaruh pada
        `POST /auth/login` dan `POST /auth/refresh`.

        **Catatan CORS:** header ini tidak ada di `allowedHeaders`
        (`backend/src/app.ts:108`). Klien native tidak terkena CORS, tetapi
        WebView/browser akan terhalang preflight.
      example: mobile

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        pattern: '^[!-~]{16,128}$'
      description: |
        Kunci idempoten opsional untuk mutasi
        (`backend/src/shared/middleware/Idempotency.ts`).

        Format: 16–128 karakter ASCII tampak (`!` sampai `~`), tanpa spasi.
        Format salah dijawab `422 VALIDATION_ERROR` dengan
        `errors[0].field = "Idempotency-Key"`.

        Scope kunci: `companyId : userId : method : path : key`, jadi satu
        kunci boleh dipakai ulang untuk aksi yang berbeda. Respons sukses
        (2xx) disimpan 24 jam; pengulangan dengan kunci dan payload yang sama
        mengembalikan respons tersimpan beserta header
        `Idempotency-Replayed: true`.

        Hanya respons sukses disimpan — kegagalan validasi, permission,
        konflik, dan error server tetap bisa dicoba ulang dengan kunci yang
        sama (`Idempotency.ts:128-131`).
      example: 9f2b7c1e4a6d8f03b5c7e9a1

    XPayslipUnlock:
      name: X-Payslip-Unlock
      in: header
      required: true
      schema: { type: string, maxLength: 1024 }
      description: |
        Token hasil `POST /payroll/payslips/my/unlock`. Berlaku 15 menit,
        terikat ke user + employee + company. Tanpa header ini (atau dengan
        token kedaluwarsa) jawabannya `403 PAYSLIP_UNLOCK_INVALID`
        (`backend/src/modules/payroll/payslip-pin.service.ts:146-157`).

        **Catatan CORS:** header ini tidak terdaftar di `allowedHeaders`
        (`app.ts:108`); relevan untuk WebView/browser, tidak untuk klien
        native.

    XPayrollUnlockToken:
      name: X-Payroll-Unlock-Token
      in: header
      required: false
      schema: { type: string, maxLength: 256 }
      description: |
        Grant hasil `POST /payroll/payslips/unlock` (jalur password/TOTP,
        bukan PIN). Berlaku 5 menit. Wajib bagi pemanggil yang punya
        `employeeId` dan tidak elevated; diabaikan untuk pemegang
        `payroll:process`/`approve`/`disburse`/`*` dan `SUPER_ADMIN`
        (`backend/src/modules/payroll/payroll.controller.ts:15-21`).
        Terdaftar di `allowedHeaders` CORS (`app.ts:108`).

    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: |
        Id sumber daya. Route ini tidak memakai `validate()` untuk params,
        jadi format id tidak dipatok skema di lapisan route.

    PathIdUuid:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Divalidasi sebagai UUID oleh route; nilai lain dijawab `422`.

    PayslipIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 36
        pattern: '^[A-Za-z0-9_-]+$'
      description: |
        Id payslip. **Bukan selalu UUID** — komentar di
        `backend/src/modules/payroll/payroll.validation.ts:24-26` menjelaskan
        data seed/impor memakai kode seperti `ps-EMP001-2606`, sehingga
        validasinya charset aman + panjang maksimum kolom (36). Jangan
        memvalidasi sebagai UUID di sisi aplikasi.

    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema: { type: string }
      description: Id permintaan tukar shift. Tidak dipatok skema di route.

    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: Nomor halaman, dimulai dari 1.

    Limit100Param20:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Jumlah baris per halaman. Maksimum 100.

  # ------------------------------------------------------------------
  responses:
    GenericSuccess:
      description: |
        Sukses. `data` tidak dipatok skema per endpoint — backend tidak punya
        skema response, jadi bentuknya ditentukan service/Prisma.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }

    Unauthorized:
      description: |
        `401`. Dua `code` yang mungkin, dan **keduanya berarti "refresh dulu,
        baru logout kalau refresh juga gagal"**:

        - `TOKEN_EXPIRED` — access token kedaluwarsa menurut `exp`
          (`backend/src/shared/security/JWTHandler.ts:122-124` →
          `AppError.ts:46-50`).
        - `AUTHENTICATION_FAILED` — semua kegagalan autentikasi lain, termasuk
          **`sessionVersion` token tidak lagi sama dengan baris user**
          (`backend/src/shared/middleware/Authenticate.ts:90-91` →
          `AppError.ts:40-44`). Lihat bagian "Invalidasi sesi" di README.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            kedaluwarsa:
              value: { success: false, code: TOKEN_EXPIRED, message: Token has expired }
            sesiDicabut:
              summary: sessionVersion sudah naik (otoritas berubah)
              value:
                success: false
                code: AUTHENTICATION_FAILED
                message: Access token session is no longer valid
            tanpaToken:
              value: { success: false, code: AUTHENTICATION_FAILED, message: No authorization token provided }

    Forbidden:
      description: |
        `403 FORBIDDEN`. Tiga sumber yang perlu dibedakan di UI:

        1. Permission kurang — `authorize()` melempar
           `Insufficient permissions. Required: <resource>:<action>`
           (`backend/src/shared/middleware/Authorize.ts:52-58`). Pesan ini
           menyebutkan permission yang diminta, jadi 403 bisa didiagnosis.
        2. Company di luar scope — `requireCompanyAccess()` melempar
           `You do not have access to this company data`
           (`backend/src/shared/middleware/CompanyScope.ts:47-49`).
        3. Aturan domain di service — mis. membatalkan cuti orang lain.

        Jangan di-retry dan jangan dianggap sesi mati.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            permission:
              value:
                success: false
                code: FORBIDDEN
                message: 'Insufficient permissions. Required: leave:approve'
            company:
              value:
                success: false
                code: FORBIDDEN
                message: You do not have access to this company data

    NotFound:
      description: |
        `404 NOT_FOUND`. Tidak ada, **atau** di luar tenant/data-scope
        pemanggil — keduanya sengaja tidak bisa dibedakan
        (`docs/api-contract.md`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    Conflict:
      description: |
        `409 CONFLICT`. Tabrakan state: duplikat, sudah disetujui, tanggal
        tumpang tindih. Pelanggaran unique constraint database juga dipetakan
        ke sini dengan pesan Indonesia
        (`backend/src/shared/middleware/ErrorHandler.ts:10-17`, `85-93`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    IdempotencyConflict:
      description: |
        `409 CONFLICT`. Selain konflik state biasa, endpoint ini bisa
        menjawab 409 karena `Idempotency-Key`
        (`backend/src/shared/middleware/Idempotency.ts:72-80`):

        - "Idempotency-Key was already used with a different request payload"
        - "A request with this Idempotency-Key is still in progress"

        Keduanya memakai `code: CONFLICT`; bedakan dari `message`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    ValidationError:
      description: |
        `422 VALIDATION_ERROR`. Validasi skema Zod gagal; `errors[]`
        menyebutkan field yang bermasalah
        (`backend/src/shared/middleware/RequestValidator.ts:22-28`,
        `ErrorHandler.ts:28-42`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorEnvelope' }
          example:
            success: false
            code: VALIDATION_ERROR
            message: Validation failed
            errors:
              - field: email
                message: Invalid email format

    NotLinkedToEmployee:
      description: |
        `400 BAD_REQUEST` — akun yang login tidak tertaut ke data karyawan
        dan/atau company aktif, sehingga route self-service tidak punya
        identitas untuk dipakai (mis.
        `backend/src/modules/attendance/attendance.controller.ts:10-12`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            code: BAD_REQUEST
            message: Akun ini tidak tertaut ke data karyawan dan perusahaan

  # ------------------------------------------------------------------
  schemas:

    # ===== Envelope =====
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      description: |
        Envelope sukses dari `Result.success/created/updated/deleted/noContent`
        (`backend/src/shared/core/Result.ts:17-87`), dipatok oleh
        `backend/src/shared/core/api-contract.test.ts`.
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          minLength: 1
          description: |
            Selalu ada dan tidak kosong. Teks untuk operator — **jangan
            dipakai sebagai cabang logika**, kecuali untuk membedakan dua
            pesan 409 idempotency yang `code`-nya sama.
        data:
          description: |
            Selalu ada. `null` untuk respons delete / no-content. Bentuknya
            tidak dipatok skema per endpoint.
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedEnvelope:
      type: object
      required: [success, message, data, meta]
      description: |
        Envelope dari `Result.paginated` (`Result.ts:26-47`). Endpoint yang
        memakainya di dokumen ini: `GET /attendance/me`,
        `GET /notifications`, `GET /announcements`, `GET /assets/my`,
        `GET /workflow-engine/instances/my-approvals`.
      properties:
        success: { type: boolean, const: true }
        message: { type: string, minLength: 1 }
        data:
          type: array
          items:
            description: Bentuk baris tidak dipatok skema.
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages, hasNextPage, hasPreviousPage]
      description: |
        Dari `PaginationMeta` (`Result.ts:1-8`) dan `Result.paginated`
        (`Result.ts:33-45`).
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages:
          type: integer
          minimum: 0
          description: '`ceil(total / limit)`; `0` untuk hasil kosong.'
        hasNextPage:
          type: boolean
          description: '`page < totalPages`. Cara paling aman untuk memutuskan memuat halaman berikutnya.'
        hasPreviousPage:
          type: boolean
          description: '`page > 1`.'
      example:
        page: 2
        limit: 10
        total: 25
        totalPages: 3
        hasNextPage: true
        hasPreviousPage: true

    ErrorEnvelope:
      type: object
      required: [success, code, message]
      description: |
        Envelope error dari `AppError.toJSON()` / `errorHandler`
        (`backend/src/shared/exceptions/AppError.ts:24-31`,
        `backend/src/shared/middleware/ErrorHandler.ts:45-82`).

        Catatan: ada beberapa respons di permukaan ini yang **tidak** membawa
        `code` — `Result.error(...)` tanpa argumen kedua
        (`Result.ts:49-55`) dan body pesan rate-limiter tertentu. Tempat
        persisnya ditandai pada endpoint masing-masing.
      properties:
        success: { type: boolean, const: false }
        code:
          type: string
          description: |
            Katalog yang dipatok `api-contract.test.ts`:
            `BAD_REQUEST` (400), `AUTHENTICATION_FAILED` (401),
            `TOKEN_EXPIRED` (401), `FORBIDDEN` (403), `NOT_FOUND` (404),
            `CONFLICT` (409), `VALIDATION_ERROR` (422),
            `TOO_MANY_REQUESTS` (429), `DATABASE_ERROR` (500),
            `SERVICE_UNAVAILABLE` (503).

            Dari app shell: `NOT_FOUND` untuk route tak dikenal
            (`app.ts:278-284`), `INTERNAL_ERROR` sebagai fallback
            (`ErrorHandler.ts:118-125`), `UPLOAD_ERROR` untuk kegagalan
            multer (`ErrorHandler.ts:95-108`).

            Kode domain yang muncul di permukaan mobile ini:
            `MFA_REQUIRED` (401), `PAYSLIP_PIN_NOT_SET` (409),
            `PAYSLIP_PIN_INVALID` (403), `PAYSLIP_PIN_LOCKED` (429),
            `PAYSLIP_PIN_REAUTH_FAILED` (403),
            `PAYSLIP_UNLOCK_INVALID` (403),
            `PAYSLIP_PDF_TOO_LARGE` (413),
            `PAYROLL_UNLOCK_REQUIRED` (401),
            `PAYROLL_REAUTH_FAILED` (401),
            `PAYROLL_UNLOCK_LOCKED` (429), `ACCOUNT_LOCKED` (429).
        message:
          type: string
          description: Teks penjelas. Sebagian dalam bahasa Indonesia, sebagian Inggris.
        correlationId:
          type: string
          description: |
            Hanya muncul bila request mengirim `X-Correlation-Id` atau
            `X-Request-Id` (`ErrorHandler.ts:25`, `56-58`). Kirim salah satu
            dari aplikasi agar laporan bug bisa ditelusuri di log server.
        errors:
          type: array
          description: Hanya pada `VALIDATION_ERROR` (dan `AppError` yang dibuat dengan daftar field).
          items: { $ref: '#/components/schemas/FieldError' }

    ValidationErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [errors]
          properties:
            code: { type: string, const: VALIDATION_ERROR }
            errors:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, message]
      description: |
        Dari `AppError.errors` (`AppError.ts:5`). `field` adalah jalur Zod
        yang digabung titik, mis. `provider`, `stages.0.level`
        (`RequestValidator.ts:23-26`).
      properties:
        field: { type: string }
        message: { type: string }

    # ===== Auth =====
    LoginRequest:
      type: object
      required: [email, password]
      description: 'Dari `loginSchema` (`backend/src/modules/auth/auth.dto.ts:3-16`).'
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Di-lowercase dan di-trim server sebelum dipakai.
        password:
          type: string
          minLength: 1
          maxLength: 128
        totp:
          type: string
          minLength: 6
          maxLength: 20
          description: |
            Kode TOTP 6 digit **atau** recovery code. Hanya perlu bila MFA
            akun aktif. Tanpa ini pada akun MFA, server menjawab
            `401 MFA_REQUIRED` — gunakan itu sebagai sinyal untuk menampilkan
            layar kode, lalu kirim ulang login lengkap dengan `totp`.

    RefreshRequest:
      type: object
      description: |
        Dari `refreshTokenSchema` (`auth.dto.ts:22-29`). Body `null`/kosong
        di-preprocess menjadi `{}` agar klien cookie boleh mengirim body
        kosong; klien mobile wajib mengisi `refreshToken`.
      properties:
        refreshToken:
          type: string
          minLength: 1

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      description: 'Dari `changePasswordSchema` (`auth.dto.ts:31-44`).'
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            Wajib memuat minimal satu huruf besar, satu huruf kecil, satu
            angka, dan satu karakter spesial dari
            `!@#$%^&*()_+-=[]{};':"\|,.<>/?`. Validasi ini sebaiknya
            diduplikasi di aplikasi agar user tidak menunggu round-trip.

    ForgotPasswordRequest:
      type: object
      required: [email]
      description: 'Dari `forgotPasswordSchema` (`auth.dto.ts:46-53`).'
      properties:
        email: { type: string, format: email, maxLength: 255 }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      description: 'Dari `resetPasswordSchema` (`auth.dto.ts:55-68`).'
      properties:
        token:
          type: string
          minLength: 1
          description: Token dari tautan reset yang dikirim ke email.
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Aturan kompleksitas sama dengan `newPassword` pada ganti password.

    MfaCodeRequest:
      type: object
      required: [code]
      description: 'Dari `mfaCodeSchema` (`auth.dto.ts:18-20`).'
      properties:
        code: { type: string, minLength: 6, maxLength: 20 }

    AuthUser:
      type: object
      required: [id, email, roles, permissions, companyScope, mustChangePassword]
      description: |
        Dari `AuthResponse['user']` (`auth.dto.ts`) dan `publicAuthUser`
        (`backend/src/modules/auth/auth.service.ts:39-52`).
      properties:
        id: { type: string }
        email: { type: string, format: email }
        employeeId:
          type: string
          description: |
            Id karyawan yang tertaut. **Boleh kosong** — akun admin tanpa data
            karyawan tidak punya ini, dan semua route self-service
            (`/attendance/me/*`, slip gaji PIN, dsb) akan menjawab
            `400 BAD_REQUEST` untuk akun seperti itu.
        name: { type: string }
        roles:
          type: array
          items: { type: string }
          description: 'Kode role, mis. `EMPLOYEE`, `MANAGER`, `HR_STAFF`, `SUPER_ADMIN`.'
        permissions:
          type: array
          items: { type: string }
          description: |
            Kode permission `resource:action`. Pakai untuk menyembunyikan menu
            yang pasti 403. Perhatikan `authorize()` juga menerima bentuk
            wildcard `resource:*` dan alias legacy seperti `att:read`
            (`backend/src/shared/middleware/Authorize.ts:42-50`), jadi
            pencocokan di aplikasi sebaiknya longgar.
        companyId:
          type: string
          description: Company aktif sesi ini.
        companyScope:
          type: array
          items: { type: string }
          description: |
            Semua company yang boleh diakses akun ini. Mengirim `companyId`
            di luar daftar ini dijawab `403 FORBIDDEN`.
        groupId: { type: string }
        mustChangePassword:
          type: boolean
          description: Bila `true`, arahkan user ke layar ganti password sebelum apa pun.

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      description: |
        Dari `TokenResponse` (`auth.dto.ts`) dan
        `auth.controller.ts:101-105`.
      properties:
        accessToken:
          type: string
          description: 'Kirim pada header `Authorization: Bearer <...>`.'
        refreshToken:
          type: string
          description: |
            Simpan di penyimpanan aman OS (Keystore / Keychain), **bukan**
            di preferences biasa. Dirotasi setiap refresh — selalu simpan
            yang terbaru.
        expiresIn:
          type: integer
          description: Masa hidup access token dalam detik.

    MobileLoginData:
      type: object
      required: [user, tokens]
      description: |
        Bentuk `data` saat `X-Client-Type: mobile`
        (`auth.controller.ts:96-111` untuk login, `167-182` untuk refresh).
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
        tokens: { $ref: '#/components/schemas/TokenPair' }

    WebLoginData:
      type: object
      required: [user, tokens, csrfToken]
      description: |
        Bentuk `data` untuk klien cookie (tanpa `X-Client-Type: mobile`)
        — `auth.controller.ts:117-126`. Dicantumkan hanya agar jelas apa
        yang **tidak** didapat klien mobile.
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
        tokens:
          type: object
          required: [expiresIn]
          properties:
            expiresIn: { type: integer }
        csrfToken: { type: string }

    SessionProfile:
      allOf:
        - $ref: '#/components/schemas/AuthUser'
        - type: object
          description: 'Tambahan dari `auth.service.ts:576-580`.'
          properties:
            companyName:
              type: string
              description: Nama company karyawan; `undefined` bila tidak ada.
            lastLoginAt:
              type: [string, 'null']
              format: date-time

    # ===== Attendance =====
    AttendanceMethod:
      type: string
      enum: [FINGERPRINT, MOBILE_GPS, MANUAL, FACE_RECOGNITION]
      description: |
        Dari `createAttendanceSchema.method`
        (`backend/src/modules/attendance/attendance.dto.ts:18`). Nilai yang
        boleh dipakai pada satu hari tertentu ada di
        `GET /attendance/me/today` → `data.context.allowedMethods`.

    DeviceGps:
      type: object
      description: |
        Dari `deviceGpsSchema` (`attendance.dto.ts:3-10`). Semua field
        opsional dan boleh `null`. Dipakai server untuk deteksi mock
        location.
      properties:
        isMockLocation:
          type: [boolean, 'null']
          description: Hasil pemeriksaan mock-location dari OS.
        mockProviderApp:
          type: [string, 'null']
          maxLength: 200
        accuracyMeters:
          type: [number, 'null']
          minimum: 0
        coordinateStaleHours:
          type: [number, 'null']
          minimum: 0
        altitudeMeters:
          type: [number, 'null']
        bearingDegrees:
          type: [number, 'null']
          minimum: 0
          maximum: 360

    LivenessMetadata:
      type: object
      description: |
        Dari `createAttendanceSchema.liveness` (`attendance.dto.ts:47-59`).
        Metadata transport saja — komentar di `attendance.dto.ts:41-42`
        menegaskan nilai ini **tidak pernah otoritatif** untuk liveness atau
        pencocokan wajah; keputusan dibuat server.
      properties:
        exifMake: { type: [string, 'null'], maxLength: 100 }
        exifModel: { type: [string, 'null'], maxLength: 100 }
        exifSoftware: { type: [string, 'null'], maxLength: 200 }
        exifDateTimeOriginal: { type: [string, 'null'], maxLength: 30 }
        pixelVariance: { type: [number, 'null'], minimum: 0 }
        fileSizeBytes: { type: [integer, 'null'], minimum: 0 }
        mimeType: { type: [string, 'null'], maxLength: 100 }
        clientSource: { type: [string, 'null'], maxLength: 50 }
        isLiveCapture: { type: [boolean, 'null'] }

    FaceRecognitionPayload:
      type: object
      description: |
        Dari `createAttendanceSchema.faceRecognition`
        (`attendance.dto.ts:30-45`).

        **Hanya `selfieImage` (dan metadata transport-nya) yang boleh dikirim
        klien.** Komentar di `attendance.dto.ts:26-29` menjelaskan field lain
        (vector, reference photo, URL storage, skor kemiripan) tetap ada di
        DTO **semata-mata supaya service bisa menolaknya secara eksplisit**,
        bukan karena boleh dipakai. Ekstraksi biometrik dilakukan server.
      properties:
        selfieImage:
          type: string
          maxLength: 7500000
          description: |
            Selfie hasil capture, format `data:image/jpeg;base64,...`.
            Batas 7.500.000 karakter base64 ≈ 5 MB biner.
        selfieMimeType: { type: string, maxLength: 100 }
        selfieFileSizeBytes: { type: integer, minimum: 0 }
        selfieUrl: { type: string, maxLength: 500 }
        referencePhotoUrl: { type: string, maxLength: 500 }
        referencePhotoImage: { type: string, maxLength: 7500000 }
        similarityScore: { type: number, minimum: -1, maximum: 1 }
        isFaceMatch: { type: boolean }
        selfieVector:
          type: array
          items: { type: number }
        referenceVector:
          type: array
          items: { type: number }

    SelfCheckInRequest:
      type: object
      description: |
        Dari `selfCheckInSchema` (`attendance.dto.ts:120-128`) — hasil
        `createAttendanceSchema.pick(...)`. Tidak ada field yang `required`.
        Waktu, tanggal, status, dan source diisi server.
      properties:
        method:
          allOf: [{ $ref: '#/components/schemas/AttendanceMethod' }]
          default: MANUAL
          description: Default `MANUAL` bila tidak dikirim. Harus ada di `allowedMethods`.
        notes: { type: string }
        checkInLatitude: { type: number }
        checkInLongitude: { type: number }
        faceRecognition: { $ref: '#/components/schemas/FaceRecognitionPayload' }
        liveness: { $ref: '#/components/schemas/LivenessMetadata' }
        deviceGps: { $ref: '#/components/schemas/DeviceGps' }

    SelfCheckOutRequest:
      type: object
      description: |
        Dari `selfCheckOutSchema` (`attendance.dto.ts:130`) —
        `checkoutAttendanceSchema` tanpa `checkOut`. Tidak ada field yang
        `required`; waktu checkout diisi server.
      properties:
        method: { $ref: '#/components/schemas/AttendanceMethod' }
        checkOutLatitude: { type: number }
        checkOutLongitude: { type: number }
        deviceGps: { $ref: '#/components/schemas/DeviceGps' }
        notes: { type: string }

    MyAttendanceToday:
      type: object
      required: [serverTime, serverDate, timezone, record, context, canCheckIn, canCheckOut]
      description: 'Dari `attendance.service.ts:442-450`.'
      properties:
        serverTime:
          type: string
          format: date-time
          description: Waktu server saat request (ISO 8601). Pakai ini, bukan jam perangkat.
        serverDate:
          type: string
          description: Tanggal kalender kantor, `YYYY-MM-DD`.
        timezone:
          type: string
          description: 'Timezone kantor, mis. `Asia/Jakarta`.'
        record:
          description: |
            Baris absensi hari ini, atau `null` bila belum check-in. Bentuk
            baris tidak dipatok skema.
        context:
          $ref: '#/components/schemas/AttendanceContext'
        canCheckIn:
          type: boolean
          description: '`true` bila belum ada record hari ini (`!record`).'
        canCheckOut:
          type: boolean
          description: '`true` bila ada `checkIn` tapi belum ada `checkOut`.'

    AttendanceContext:
      type: object
      required: [allowedMethods]
      description: |
        Dari `attendance.service.ts:496-500`. Objek ini adalah hasil
        `attendanceContextService.resolve(...)` yang disebar (`...context`)
        ditambah dua field di bawah, jadi field lainnya (policy, schedule,
        warnings) ada tetapi tidak dipatok skema di sini.
      properties:
        allowedMethods:
          type: array
          items: { $ref: '#/components/schemas/AttendanceMethod' }
          description: |
            Metode absensi yang diizinkan untuk karyawan ini pada hari ini,
            hasil kebijakan cabang disaring flag per-karyawan. Hanya tampilkan
            tombol untuk metode yang ada di sini — mengirim metode lain
            dijawab `400 BAD_REQUEST`.
        policySnapshot:
          type: object
          additionalProperties: true
          description: Rekaman kebijakan yang berlaku saat itu, untuk audit.
      additionalProperties: true

    OvertimeRequest:
      type: object
      required: [date, startTime, endTime, durationHours, reason]
      description: |
        Dari `overtimeRequestSchema` (`attendance.dto.ts:151-153`):
        `createOvertimeSchema` tanpa `companyId`, dengan `employeeId`
        menjadi opsional.
      properties:
        employeeId:
          type: string
          format: uuid
          description: |
            Hanya dihormati untuk user elevated; karyawan biasa dipaksa ke
            identitas sesinya (`attendance.dto.ts:149-150`). Mobile karyawan
            boleh mengosongkannya.
        date: { type: string, format: date-time }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        durationHours:
          type: number
          exclusiveMinimum: 0
        reason:
          type: string
          minLength: 1
        multiplier:
          type: number
          default: 1.5
          description: Default 1.5 bila tidak dikirim.

    AttendanceCorrectionRequest:
      type: object
      required: [date, reason]
      description: |
        Dari `createAttendanceCorrectionSchema`
        (`backend/src/modules/attendance/attendance-correction.dto.ts:3-12`).
        Minimal satu dari `requestedCheckIn` / `requestedCheckOut` wajib ada,
        divalidasi lewat `.refine()`.
      properties:
        attendanceId:
          type: string
          format: uuid
          description: Record absensi yang dikoreksi. Boleh kosong bila belum ada record untuk tanggal itu.
        date: { type: string, format: date-time }
        requestedCheckIn: { type: string, format: date-time }
        requestedCheckOut: { type: string, format: date-time }
        reason:
          type: string
          minLength: 3
          maxLength: 2000
          description: Di-trim sebelum divalidasi.

    # ===== Leave =====
    CreateLeaveRequest:
      type: object
      required: [employeeId, companyId, leaveTypeId, startDate, endDate, reason]
      description: |
        Dari `createLeaveRequestSchema`
        (`backend/src/modules/leave/leave.dto.ts:14-22`).

        `employeeId` dan `companyId` **wajib** karena validasi berjalan
        sebelum controller/middleware yang menimpanya. Ambil keduanya dari
        `GET /auth/me`.
      properties:
        employeeId:
          type: string
          format: uuid
          description: Ditimpa server dengan `req.user.employeeId` (`leave.controller.ts:49`), tapi tetap wajib lolos validasi.
        companyId:
          type: string
          format: uuid
          description: Harus berada dalam `companyScope`; ditimpa dengan company efektif sesi.
        leaveTypeId:
          type: string
          format: uuid
          description: 'Dari `GET /leave/types`.'
        startDate:
          type: string
          format: date-time
          description: ISO 8601 lengkap (`z.string().datetime()`), bukan `YYYY-MM-DD`.
        endDate:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
        attachment:
          type: string
          description: |
            URL hasil `POST /leave/attachments`. Wajib untuk tipe cuti
            tertentu atau pengajuan mendekati tanggal cuti — aturannya
            ditegakkan di service, bukan skema.

    LeaveAttachmentData:
      type: object
      required: [fileName, originalName, mimeType, size, url]
      description: 'Dari `leave.controller.ts:62-70`.'
      properties:
        fileName:
          type: string
          description: Nama acak (UUID) di storage privat.
        originalName: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        url:
          type: string
          description: |
            URL absolut ke endpoint terotorisasi
            `/private-files/leave-attachments/...`. Masih memerlukan sesi
            aktif untuk diunduh — bukan URL publik.

    # ===== Payroll =====
    PayslipSummary:
      type: object
      required: [id, status, createdAt, locked]
      description: |
        Dari `payroll.repository.ts:470-482` (select) ditambah `locked`
        (`payroll.controller.ts:384`). **Tidak ada nominal di sini.**
      properties:
        id:
          type: string
          description: 'Id payslip; belum tentu UUID (lihat parameter `PayslipIdPath`).'
        status: { type: string }
        createdAt: { type: string, format: date-time }
        locked:
          type: boolean
          const: true
          description: Selalu `true` pada daftar ini. Nominal hanya tersedia lewat endpoint detail setelah unlock.
        payrollRun:
          $ref: '#/components/schemas/PayrollRunSummary'

    PayrollRunSummary:
      type: object
      description: 'Dari `payslipRunSelect` (`payroll.repository.ts:15-18`).'
      properties:
        id: { type: string }
        name: { type: string }
        runNumber: { type: [string, integer] }
        status:
          type: string
          description: Daftar self-service hanya memuat run `APPROVED` atau `DISBURSED`.
        period:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            code: { type: string }
            frequency: { type: string }
            startDate: { type: string, format: date-time }
            endDate: { type: string, format: date-time }
            payDate: { type: string, format: date-time }

    SetPayslipPinRequest:
      type: object
      required: [currentPassword, pin]
      description: 'Dari `setPayslipPinSchema` (`backend/src/modules/payroll/payroll.validation.ts:38-41`).'
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          description: Password akun, sebagai reautentikasi.
        pin:
          type: string
          pattern: '^\d{6}$'
          description: Tepat 6 digit angka. Pesan Zod-nya "PIN harus terdiri dari 6 digit angka".

    PayslipPinUnlockRequest:
      type: object
      required: [pin]
      description: 'Dari `payslipPinUnlockSchema` (`payroll.validation.ts:43-45`).'
      properties:
        pin:
          type: string
          pattern: '^\d{6}$'

    PayslipPinStatus:
      type: object
      required: [pinSet]
      description: 'Dari `payslip-pin.service.ts:91-101`.'
      properties:
        pinSet:
          type: boolean
          description: '`true` bila `users.payslip_pin_hash` sudah terisi.'
        lockedUntil:
          type: string
          format: date-time
          description: |
            **Hanya ada bila lock masih berjalan.** Tidak ada field ini
            berarti tidak terkunci — jangan asumsikan `null`.

    PayslipUnlockData:
      type: object
      required: [unlockToken, expiresAt]
      description: 'Dari `payslip-pin.service.ts:137-142`.'
      properties:
        unlockToken:
          type: string
          description: |
            Kirim pada header `X-Payslip-Unlock`. Simpan di memori saja,
            jangan persist.
        expiresAt:
          type: string
          format: date-time
          description: 15 menit dari sekarang.

    PayrollUnlockRequest:
      type: object
      required: [password]
      description: 'Dari `payrollUnlockSchema` (`payroll.validation.ts:31-34`).'
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }
        totp:
          type: string
          minLength: 6
          maxLength: 20
          description: Wajib bila MFA akun aktif. Di-trim sebelum divalidasi.

    PayrollUnlockData:
      type: object
      required: [unlockToken, tokenType, expiresAt, expiresIn]
      description: 'Dari `backend/src/modules/payroll/payroll-unlock.service.ts:128-134`.'
      properties:
        unlockToken:
          type: string
          description: Kirim pada header `X-Payroll-Unlock-Token`.
        tokenType:
          type: string
          const: PayrollUnlock
        expiresAt: { type: string, format: date-time }
        expiresIn:
          type: integer
          const: 300
          description: '`PAYROLL_UNLOCK_TTL_SECONDS` = 5 menit.'

    PayslipDetail:
      type: object
      description: |
        Dari `payslip-pin.service.ts:164-207`. Baris payslip lengkap dari
        Prisma (nominal ada di sini) ditambah `breakdown`. Field tidak
        dipatok skema karena berasal langsung dari model Prisma.
      properties:
        id: { type: string }
        status: { type: string }
        baseSalary:
          description: 'Decimal Prisma — diserialisasi sebagai string atau number tergantung driver. Parse dengan hati-hati.'
        totalEarnings: {}
        totalDeductions: {}
        netPay: {}
        employee:
          type: object
          properties:
            id: { type: string }
            fullName: { type: string }
            employeeNumber: { type: string }
        payrollRun:
          $ref: '#/components/schemas/PayrollRunSummary'
        components:
          type: array
          description: Komponen gaji dengan `salaryComponent { id, code, name, type }`.
          items:
            type: object
            additionalProperties: true
        breakdown:
          type: object
          additionalProperties: true
          description: 'Hasil `buildPayslipBreakdown` (`backend/src/shared/payroll/payslip-breakdown.ts`).'
      additionalProperties: true

    # ===== Workflow =====
    WorkflowActionRequest:
      type: object
      required: [action]
      description: |
        Dari `workflowActionSchema`
        (`backend/src/modules/workflow-engine/workflow-engine.dto.ts:45-48`).
        Skema yang sama dipakai oleh route `workflow-action` di modul
        attendance, attendance-corrections, leave, work-calendar, dll.
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT, ESCALATE]
        comment:
          type: string
          maxLength: 2000

    BulkApprovalRequest:
      type: object
      required: [instanceIds, action]
      description: 'Dari `bulkApprovalSchema` (`workflow-engine.dto.ts:50-54`).'
      properties:
        instanceIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
        action:
          type: string
          enum: [APPROVE, REJECT, ESCALATE]
        comment:
          type: string
          maxLength: 2000

    CreateDelegationRequest:
      type: object
      required: [delegateId, startDate, endDate]
      description: 'Dari `createDelegationSchema` (`workflow-engine.dto.ts:68-73`).'
      properties:
        delegateId:
          type: string
          format: uuid
          description: User yang menerima delegasi. Pendelegasi selalu pemanggil.
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        reason:
          type: string
          maxLength: 1000

    # ===== Notification =====
    RegisterDeviceRequest:
      type: object
      required: [installationId, platform, provider, token]
      description: |
        Dari `registerMobileDeviceSchema`
        (`backend/src/modules/notification/mobile-device.dto.ts:3-13`).
        Semua string di-trim sebelum divalidasi.
      properties:
        installationId:
          type: string
          minLength: 8
          maxLength: 200
          description: Id instalasi aplikasi yang stabil per perangkat.
        platform:
          type: string
          enum: [ANDROID, IOS]
        provider:
          type: string
          enum: [FCM, APNS]
          description: '`APNS` hanya boleh dengan `platform: IOS`; kalau tidak, `422` pada field `provider`.'
        token:
          type: string
          minLength: 20
          maxLength: 4096
          description: Token push dari FCM/APNS.
        appVersion:
          type: string
          maxLength: 50
        deviceModel:
          type: string
          maxLength: 100

    CountData:
      type: object
      required: [count]
      description: 'Bentuk `data` untuk endpoint `unread-count` (notification dan announcement).'
      properties:
        count: { type: integer, minimum: 0 }

    # ===== Employee =====
    EmployeeWithMaskablePii:
      type: object
      description: |
        Baris karyawan dari Prisma; field selain PII tidak dipatok skema.
        Enam field di bawah adalah daftar persis
        `SENSITIVE_EMPLOYEE_FIELDS`
        (`backend/src/modules/employee/employee-pii.ts:10-17`) yang di-mask
        kecuali pemanggil berhak.
      properties:
        id: { type: string }
        fullName: { type: string }
        idNumber:
          type: [string, 'null']
          description: 'NIK. Ter-mask: `************0001` (panjang asli dipertahankan).'
        taxId:
          type: [string, 'null']
          description: 'NPWP. Ter-mask dengan aturan yang sama.'
        bankAccount:
          type: [string, 'null']
          description: Nomor rekening. Ter-mask.
        bankAccountHolder:
          type: [string, 'null']
          description: |
            Nama pemilik rekening — **juga ter-mask**, jadi nilai seperti
            `*********anto` adalah hasil masking, bukan data rusak.
        bpjsKetenagakerjaan:
          type: [string, 'null']
          description: Ter-mask.
        bpjsKesehatan:
          type: [string, 'null']
          description: Ter-mask.
      additionalProperties: true

    # ===== Work calendar =====
    CreateShiftSwapRequest:
      type: object
      required: [targetEmployeeId, shiftDate, reason]
      description: |
        Dari `createShiftSwapRequestSchema`
        (`backend/src/modules/work-calendar/work-calendar.dto.ts:96-100`).
      properties:
        targetEmployeeId:
          type: string
          format: uuid
          description: 'Rekan yang diajak bertukar; ambil dari `GET /work-calendars/shift-swaps/candidates/my`.'
        shiftDate:
          type: string
          description: |
            `z.string()` tanpa pola — format tidak dipatok skema di DTO ini.
            Tidak dapat ditentukan dari source apakah server mengharapkan
            `YYYY-MM-DD` atau ISO 8601 lengkap; konfirmasikan ke tim backend
            atau coba di staging.
        reason:
          type: string
          minLength: 1
          maxLength: 1000

    ReviewShiftSwapRequest:
      type: object
      description: 'Dari `reviewShiftSwapRequestSchema` (`work-calendar.dto.ts:102-104`). Tidak ada field wajib.'
      properties:
        approvalNotes:
          type: string
          maxLength: 1000

    # ===== Permission request / loan / EWA / daily activity =====
    CreatePermissionRequest:
      type: object
      required: [type, startDate, endDate, duration, reason]
      description: |
        Dari `createPermissionSchema`
        (`backend/src/modules/permission-request/permission-request.dto.ts:3-14`).
      properties:
        type:
          type: string
          enum: [SICK, PERSONAL, LATE, EARLY_LEAVE, LEAVE_OFFICE, BUSINESS_TRIP, WORK_FROM_HOME, OTHER]
        startDate:
          type: string
          description: '`z.string()` tanpa pola — format tidak dipatok skema.'
        endDate:
          type: string
          description: '`z.string()` tanpa pola.'
        duration:
          type: number
          exclusiveMinimum: 0
          description: Satuan tidak dinyatakan di DTO (jam atau hari); tidak dapat ditentukan dari skema.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        attachment:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Opsional di skema, **wajib menurut kebijakan bisnis** — service
            menolak tanpa lampiran dengan `400 BAD_REQUEST` berbahasa
            Indonesia (`permission-request.dto.ts:11-13`).

    CreateLoanRequest:
      type: object
      required: [loanTypeId, amount, totalInstallments, installmentAmount, reason]
      description: |
        Dari `createLoanSchema`
        (`backend/src/modules/employee-loan/employee-loan.dto.ts:3-9`).
      properties:
        loanTypeId:
          type: string
          format: uuid
          description: 'Dari `GET /employee-loans/types`.'
        amount:
          type: number
          exclusiveMinimum: 0
        totalInstallments:
          type: integer
          minimum: 1
          maximum: 60
        installmentAmount:
          type: number
          exclusiveMinimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 1000

    CreateEwaRequest:
      type: object
      required: [amountRequested]
      description: |
        Dari `createEWARequestSchema`
        (`backend/src/modules/ewa/ewa.dto.ts`). Nilai uang menerima number
        **atau** string numerik, dengan maksimum 2 angka desimal.
      properties:
        amountRequested:
          type: [number, string]
          description: |
            Harus > 0, maksimum 9.999.999.999.999,99 dan paling banyak dua
            angka desimal. String numerik diterima dan di-coerce.
        adminFee:
          type: [number, string]
          description: Boleh 0. Aturan desimal sama.
        employeeId:
          type: string
          format: uuid
          description: Opsional; untuk pengajuan atas nama orang lain oleh user yang berhak.
        payrollPeriodId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 3
          maxLength: 4000
          description: Di-trim. Pesan Zod bila terlalu pendek "Alasan minimal 3 karakter".

    CreateDailyActivityRequest:
      type: object
      required: [branchId, activityDate, title, latitude, longitude, startTime, endTime]
      description: |
        Dari `createDailyActivitySchema`
        (`backend/src/modules/daily-activity/daily-activity.dto.ts:13-30`).
        Field tanggal/waktu memakai `z.coerce.date()`, jadi string ISO 8601
        diterima dan dikonversi.
      properties:
        employeeId:
          type: string
          minLength: 1
          description: Opsional; untuk pelaporan atas nama orang lain.
        branchId:
          type: string
          minLength: 1
          description: 'Lokasi site/branch. Pesan Zod: "Lokasi site / branch wajib dipilih".'
        activityDate:
          type: string
          format: date-time
        activityType:
          type: string
          enum: [WORK, SITE_VISIT, SITE_INSPECTION, MEETING, OTHER]
          default: WORK
        title:
          type: string
          minLength: 3
        description: { type: string }
        photoUrl: { type: string }
        latitude:
          type: number
          description: Wajib. Di-coerce dari string.
        longitude:
          type: number
          description: Wajib.
        geoAccuracyMeters:
          type: number
          minimum: 0
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        notes: { type: string }

    CompleteDailyActivityRequest:
      type: object
      description: 'Dari `completeDailyActivitySchema` (`daily-activity.dto.ts:40-43`). Tidak ada field wajib.'
      properties:
        actualEndTime: { type: string, format: date-time }
        notes: { type: string }

    # ===== Meta =====
    MetaEndpointsResponse:
      type: object
      required: [success, data]
      description: |
        Dari `backend/src/app.ts:257`. **Bukan** envelope `Result` — tidak ada
        `message`.
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [count, endpoints]
          properties:
            count: { type: integer }
            endpoints:
              type: array
              items:
                type: object
                required: [path, methods, middlewares]
                properties:
                  path: { type: string }
                  methods:
                    type: array
                    items: { type: string }
                  middlewares:
                    type: array
                    items: { type: string }
