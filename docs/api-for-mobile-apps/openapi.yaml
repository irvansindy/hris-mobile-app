  /attendance/me/check-in:
    post:
      tags: [attendance]
      operationId: attendanceCheckInSelf
      summary: Check-in (clock-in) untuk diri sendiri
      description: |
        Sumber: `attendance.routes.ts:28`, `attendance.controller.ts:38-47`,
        `attendance.service.ts:453-464`.

        Server yang menentukan waktu dan tanggal: `checkIn` diisi
        `clock.now`, `date` diisi tanggal kalender kantor, `status` dipaksa
        `PRESENT`, `source` dipaksa `MOBILE_SELF_SERVICE`. Aplikasi **tidak
        boleh** mengirim waktu — skema `selfCheckInSchema`
        (`attendance.dto.ts:120-128`) hanya menerima `method`, `notes`,
        koordinat check-in, `faceRecognition`, `liveness`, `deviceGps`.

        `method` harus ada di `context.allowedMethods` dari
        `GET /attendance/me/today`; kalau tidak, service menjawab
        `400 BAD_REQUEST` dengan pesan "Metode absensi ini tidak diizinkan..."
        (`attendance.service.ts:517-519`).

        Mendukung `Idempotency-Key` (`idempotency()` pada route). Status
        sukses: `201`.

        Permission: tidak ada `authorize()`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelfCheckInRequest' }
            examples:
              gps:
                summary: Metode MOBILE_GPS
                value:
                  method: MOBILE_GPS
                  checkInLatitude: -6.2
                  checkInLongitude: 106.816666
                  deviceGps:
                    isMockLocation: false
                    accuracyMeters: 12
                  notes: Masuk dari kantor pusat
      responses:
        '201':
          description: Record absensi dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: |
            `BAD_REQUEST` — akun tidak tertaut karyawan
            (`attendance.controller.ts:41`), sudah ada absensi untuk tanggal
            itu (`attendance.service.ts:508`), metode tidak diizinkan
            (`attendance.service.ts:518`), atau hari non-kerja tanpa izin
            kebijakan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /attendance/me/check-out:
