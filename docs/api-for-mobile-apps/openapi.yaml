  # ==================================================================
  # PAYROLL — slip gaji self-service
  # ==================================================================
  /payroll/payslips:
    get:
      tags: [payroll]
      operationId: payrollListMyPayslips
      summary: Daftar periode slip gaji sendiri (tanpa nominal)
      description: |
        Sumber: `backend/src/modules/payroll/payroll.routes.ts:399-403`,
        `payroll.controller.ts:375-388`,
        `payroll.service.ts:519-526`,
        `payroll.repository.ts:470-482`.
        **Permission: `payroll:read`.**

        Walaupun guard-nya `payroll:read`, handler-nya adalah
        `findMyPayslips`: `employeeId` **wajib** berasal dari token, bukan
        query, "cegah intip slip gaji orang lain"
        (`payroll.controller.ts:378`). Service menolak bila `employeeId`
        sesi tidak cocok (`403 FORBIDDEN`, `payroll.service.ts:521`).

        **Tanpa nominal.** `select` di repository hanya mengambil `id`,
        `status`, `createdAt`, dan `payrollRun` (termasuk `period`) — tidak
        ada `baseSalary`, `totalEarnings`, `totalDeductions`, atau `netPay`.
        Controller menambahkan `locked: true` pada setiap baris
        (`payroll.controller.ts:384`). Hanya run berstatus `APPROVED` atau
        `DISBURSED` yang muncul, maksimal 20 baris terbaru (tidak ada
        parameter pagination di route ini).

        Untuk melihat nominal, lihat alur PIN di
        `POST /payroll/payslips/my/unlock`.
      responses:
        '200':
          description: 'Daftar periode slip gaji, semuanya `locked: true`.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PayslipSummary' }
        '400':
          description: |
            Akun tidak tertaut data karyawan. Catatan: controller menjawab ini
            dengan `Result.error(...)` tanpa `code`
            (`payroll.controller.ts:381`), jadi body-nya hanya
            `{ success: false, message }`. Ini satu-satunya respons error pada
            permukaan ini yang tidak membawa `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: false }
                  message: { type: string }
              example: { success: false, message: Akun ini tidak tertaut ke data karyawan }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payroll/payslips/pin:
    put:
      tags: [payroll]
      operationId: payrollSetPayslipPin
      summary: Atur / ubah PIN slip gaji (6 digit)
      description: |
        Sumber: `payroll.routes.ts:336-341`,
        `payroll.controller.ts:392-401`,
        `backend/src/modules/payroll/payslip-pin.service.ts:70-89`.

        **Tidak ada `authorize()`** — ini self-service murni; identitas selalu
        dari sesi. Perlu `currentPassword` akun sebagai reautentikasi.

        PIN harus tepat 6 digit angka (`payroll.validation.ts:36`). PIN
        disimpan sebagai hash argon2id, tidak pernah dikembalikan atau
        di-log.

        Rate limit khusus: 30 request / 15 menit per IP
        (`payroll.routes.ts:326-333`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPayslipPinRequest' }
            examples:
              set:
                value: { currentPassword: "RahasiaKuat1!", pin: "135791" }
      responses:
        '200':
          description: 'PIN tersimpan. `data` adalah `null`; pesan "PIN slip gaji berhasil disimpan".'
          headers:
            Cache-Control:
              description: '`no-store` (`payroll.controller.ts:96`).'
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: 'null' }
        '400':
          description: |
            `BAD_REQUEST` — PIN bukan 6 digit
            (`payslip-pin.service.ts:73`), atau akun tidak tertaut ke data
            karyawan pada company aktif (`payslip-pin.service.ts:45`, `64`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `PAYSLIP_PIN_REAUTH_FAILED` — `currentPassword` salah
            (`payslip-pin.service.ts:77`). Status 403, bukan 401, jadi jangan
            perlakukan sebagai sesi mati.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, code: PAYSLIP_PIN_REAUTH_FAILED, message: Kata sandi salah }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Rate limiter PIN. Body limiter ini hanya `{ success, message }`, tanpa `code` (`payroll.routes.ts:332`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: false }
                  message: { type: string }

  /payroll/payslips/pin/status:
    get:
      tags: [payroll]
      operationId: payrollGetPayslipPinStatus
      summary: Apakah PIN slip gaji sudah diatur / sedang terkunci
      description: |
        Sumber: `payroll.routes.ts:343-346`,
        `payroll.controller.ts:403-412`,
        `payslip-pin.service.ts:91-101`.

        Tidak ada `authorize()`. Pakai ini untuk memilih layar: "atur PIN" bila
        `pinSet` `false`, atau "masukkan PIN" bila `true`. `lockedUntil` hanya
        muncul bila lock masih berjalan.
      responses:
        '200':
          description: Status PIN.
          headers:
            Cache-Control:
              description: '`no-store`.'
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayslipPinStatus' }
              examples:
                belumDiatur:
                  value: { success: true, message: Success, data: { pinSet: false } }
                terkunci:
                  value:
                    success: true
                    message: Success
                    data: { pinSet: true, lockedUntil: "2026-10-04T07:45:00.000Z" }
        '400':
          description: '`BAD_REQUEST` — akun tidak tertaut data karyawan / company aktif.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payroll/payslips/my/unlock:
    post:
      tags: [payroll]
      operationId: payrollUnlockMyPayslips
      summary: Verifikasi PIN → token buka slip gaji (berlaku 15 menit)
      description: |
        Sumber: `payroll.routes.ts:348-353`,
        `payroll.controller.ts:414-423`,
        `payslip-pin.service.ts:104-143`,
        `backend/src/shared/payroll/payslip-pin.ts`.

        **Inilah mekanisme buka nominal slip gaji untuk mobile.** PIN benar
        menghasilkan `data.unlockToken` — token HMAC-SHA256 stateless yang
        terikat ke `userId` + `employeeId` + `companyId`, berlaku
        `PAYSLIP_UNLOCK_TTL_MINUTES = 15` menit
        (`shared/payroll/payslip-pin.ts:20`, `74-84`).

        Kirim token itu pada header **`X-Payslip-Unlock`** (bukan
        `Authorization`, bukan `X-Payroll-Unlock-Token`) saat memanggil
        `GET /payroll/payslips/my/{id}` dan
        `GET /payroll/payslips/my/{id}/pdf`
        (`payroll.controller.ts:28-32`). Simpan hanya di memori.

        Lockout: 5 PIN salah mengunci 15 menit
        (`PAYSLIP_PIN_MAX_ATTEMPTS = 5`,
        `PAYSLIP_PIN_LOCK_MINUTES = 15`,
        `shared/payroll/payslip-pin.ts:18-19`). Plus rate limiter 30 request
        / 15 menit per IP.

        Catatan desain (`shared/payroll/payslip-pin.ts:8-14`): token ini
        **sengaja berbeda** dari `PayrollUnlockSession` jalur admin
        (`X-Payroll-Unlock-Token`), supaya PIN 6 digit tidak pernah diterima
        di jalur admin dan unlock PIN tidak mencabut sesi admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayslipPinUnlockRequest' }
            examples:
              unlock:
                value: { pin: "135791" }
      responses:
        '200':
          description: PIN benar; token buka diterbitkan.
          headers:
            Cache-Control:
              description: '`no-store`.'
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayslipUnlockData' }
              example:
                success: true
                message: Slip gaji terbuka
                data:
                  unlockToken: eyJ1c2VySWQiOiIxMSJ9.Zm9vYmFyc2lnbmF0dXJl
                  expiresAt: "2026-10-04T08:00:00.000Z"
        '400':
          description: '`BAD_REQUEST` — akun tidak tertaut data karyawan / company aktif.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `PAYSLIP_PIN_INVALID` — PIN salah dan belum mencapai batas lockout
            (`payslip-pin.service.ts:128`). Tampilkan "PIN salah" dan biarkan
            user mencoba lagi; jangan logout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, code: PAYSLIP_PIN_INVALID, message: PIN salah }
        '409':
          description: |
            `PAYSLIP_PIN_NOT_SET` — PIN belum pernah diatur
            (`payslip-pin.service.ts:112`). Arahkan user ke
            `PUT /payroll/payslips/pin`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                code: PAYSLIP_PIN_NOT_SET
                message: PIN slip gaji belum diatur. Atur PIN terlebih dahulu.
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: |
            Dua kemungkinan. `PAYSLIP_PIN_LOCKED` dari service
            (`payslip-pin.service.ts:32-40`) — envelope error lengkap dengan
            `code`, pesannya menyebutkan sisa menit. Atau rate limiter route
            — body hanya `{ success, message }` tanpa `code`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                code: PAYSLIP_PIN_LOCKED
                message: Terlalu banyak percobaan PIN salah. Coba lagi dalam 15 menit.

  /payroll/payslips/my/{id}:
    get:
      tags: [payroll]
      operationId: payrollGetMyPayslipDetail
      summary: Detail lengkap slip gaji sendiri (butuh X-Payslip-Unlock)
      description: |
        Sumber: `payroll.routes.ts:362-367`,
        `payroll.controller.ts:425-435`,
        `payslip-pin.service.ts:164-207`.

        Tidak ada `authorize()`. Yang menjaga endpoint ini adalah header
        `X-Payslip-Unlock` (`payslipPinService.assertUnlockToken`). Scope
        keras: `employeeId` dan `companyId` dari sesi, dan hanya payroll run
        berstatus `APPROVED` atau `DISBURSED`
        (`payslip-pin.service.ts:175`).

        `data` berisi baris payslip lengkap (`baseSalary`, `totalEarnings`,
        `totalDeductions`, `netPay`, `components[]`) plus `breakdown` hasil
        `buildPayslipBreakdown`.
      parameters:
        - $ref: '#/components/parameters/PayslipIdPath'
        - $ref: '#/components/parameters/XPayslipUnlock'
      responses:
        '200':
          description: Detail slip gaji dengan nominal.
          headers:
            Cache-Control:
              description: '`no-store, private`.'
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayslipDetail' }
        '400':
          description: '`BAD_REQUEST` — akun tidak tertaut data karyawan / company aktif.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `PAYSLIP_UNLOCK_INVALID` — header `X-Payslip-Unlock` tidak ada,
            tanda tangannya salah, sudah kedaluwarsa, atau identitas di dalam
            token tidak cocok dengan sesi sekarang
            (`payslip-pin.service.ts:150-156`). Minta PIN lagi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                code: PAYSLIP_UNLOCK_INVALID
                message: Sesi buka slip gaji tidak valid atau sudah kedaluwarsa. Masukkan PIN kembali.
        '404':
          description: '`NOT_FOUND` — "Slip gaji tidak ditemukan" (termasuk bila slip itu bukan milik pemanggil).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payroll/payslips/my/{id}/pdf:
    get:
      tags: [payroll]
      operationId: payrollDownloadMyPayslipPdf
      summary: Unduh PDF slip gaji sendiri (butuh X-Payslip-Unlock)
      description: |
        Sumber: `payroll.routes.ts:355-360`,
        `payroll.controller.ts:437-454`.

        Tidak ada `authorize()`; dijaga header `X-Payslip-Unlock` yang sama.
        PDF dibuat on-demand (pdfkit), dikirim sebagai attachment, tanpa URL
        publik dan tanpa file sementara. Batas 5 MB; di atasnya dijawab
        `413 PAYSLIP_PDF_TOO_LARGE` (`payroll.controller.ts:444`).
      parameters:
        - $ref: '#/components/parameters/PayslipIdPath'
        - $ref: '#/components/parameters/XPayslipUnlock'
      responses:
        '200':
          description: Berkas PDF (bukan envelope JSON).
          headers:
            Content-Disposition:
              description: '`attachment; filename="payslip-<id>.pdf"`.'
              schema: { type: string }
            Cache-Control:
              description: '`no-store, private`.'
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`PAYSLIP_UNLOCK_INVALID` — lihat endpoint detail di atas.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: '`PAYSLIP_PDF_TOO_LARGE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payroll/payslips/unlock:
    post:
      tags: [payroll]
      operationId: payrollUnlockPayslips
      summary: Reautentikasi password (+TOTP) → grant payroll 5 menit (jalur non-PIN)
      description: |
        Sumber: `payroll.routes.ts:370-375`,
        `backend/src/modules/payroll/payroll-unlock.service.ts`.
        **Permission: `payroll:read`.**

        Ini **jalur berbeda** dari PIN. Grant yang dihasilkan dikirim pada
        header `X-Payroll-Unlock-Token` dan diperiksa pada
        `GET /payroll/payslips/{id}` serta
        `GET /payroll/payslips/{id}/pdf` — tetapi hanya untuk pemanggil yang
        punya `employeeId` dan **tidak** elevated; pemegang
        `payroll:process` / `payroll:approve` / `payroll:disburse` /
        `payroll:*` atau `SUPER_ADMIN` dilewati
        (`payroll.controller.ts:15-21`, `344-346`, `357-359`).

        TTL grant: `PAYROLL_UNLOCK_TTL_SECONDS = 300` (5 menit)
        (`payroll-unlock.service.ts:7`). Unlock baru mencabut grant lama
        (`payroll-unlock.service.ts:53-56`). Lockout:
        `PAYROLL_UNLOCK_LOCK_MINUTES = 15`.

        **Untuk aplikasi mobile karyawan, pakai jalur PIN**
        (`/payroll/payslips/my/*`): lebih cocok untuk UX mobile dan tidak
        meminta password akun setiap kali.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayrollUnlockRequest' }
      responses:
        '200':
          description: Grant diterbitkan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayrollUnlockData' }
        '400':
          description: '`BAD_REQUEST` — akun tidak tertaut employee dan company aktif.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: '`PAYROLL_REAUTH_FAILED` — password atau TOTP salah (`payroll-unlock.service.ts:60`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: |
            `PAYROLL_UNLOCK_LOCKED` (`payroll-unlock.service.ts:26-31`) atau
            `ACCOUNT_LOCKED` (`payroll-unlock.service.ts:91`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /payroll/payslips/lock:
    post:
      tags: [payroll]
      operationId: payrollLockPayslips
      summary: Cabut seluruh grant payroll aktif milik sendiri
      description: |
        Sumber: '`payroll.routes.ts:377-381`. **Permission: `payroll:read`.**'
        Tanpa body tervalidasi. Pasangan dari `/payroll/payslips/unlock`.
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payroll/payslips/{id}:
    get:
