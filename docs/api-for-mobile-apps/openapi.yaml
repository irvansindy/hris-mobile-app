  /notifications/device-tokens:
    post:
      tags: [notification]
      operationId: notificationRegisterDevice
      summary: Daftarkan device token push (FCM / APNS)
      description: |
        Sumber:
        `backend/src/modules/notification/notification.routes.ts:14`,
        `notification.controller.ts` (`registerDevice`),
        `backend/src/modules/notification/mobile-device.dto.ts:3-13`.

        Tidak ada `authorize()`. Panggil setelah login dan setiap kali token
        push berubah. `installationId` adalah id instalasi aplikasi yang
        stabil milik aplikasi sendiri — dipakai server untuk mengganti token
        lama perangkat yang sama.

        Aturan silang: `provider: APNS` hanya boleh dengan
        `platform: IOS`; pelanggaran dijawab `422` dengan
        `errors[0].field = "provider"` (`mobile-device.dto.ts:10-13`).

        Mendukung `Idempotency-Key`. Status sukses `201`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceRequest' }
            examples:
              android:
                value:
                  installationId: a1b2c3d4e5f6a7b8
                  platform: ANDROID
                  provider: FCM
                  token: fcm-token-minimal-dua-puluh-karakter
                  appVersion: 1.4.0
                  deviceModel: Pixel 8
      responses:
        '201':
          description: 'Token terdaftar. Pesan: "Device token registered".'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [notification]
      operationId: notificationUnregisterDevice
      summary: Hapus device token push
      description: |
        Sumber: `notification.routes.ts:15`,
        `mobile-device.dto.ts:15-17`.

        Perhatikan: ini `DELETE` **dengan body JSON** berisi
        `installationId`. Beberapa HTTP client mobile perlu konfigurasi
        khusus untuk mengirim body pada DELETE.

        Panggil saat logout, agar push tidak lagi dikirim ke perangkat itu.
        Mendukung `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installationId]
              properties:
                installationId:
                  type: string
                  minLength: 8
                  maxLength: 200
                  description: Di-trim sebelum divalidasi.
      responses:
        '200':
          description: '`data` adalah `null`; pesan "Device token unregistered".'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

