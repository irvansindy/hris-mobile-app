        Panggil ini untuk mengisi dropdown "jenis cuti"; `id` yang dikembalikan
        adalah `leaveTypeId` yang dipakai saat mengajukan cuti. Tidak ada
        `validate()` untuk query, jadi tidak ada parameter query yang dipatok.
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /leave:
    get:
      tags: [leave]
      operationId: leaveListRequests
      summary: Daftar pengajuan cuti dalam data scope pemanggil
      description: |
        Sumber: `leave.routes.ts:135`, `leave.controller.ts:31-40`.
        **Permission: `leave:read`.**

        Tidak ada `validate()` di route ini; controller membaca `companyId`,
        `employeeId`, `status`, `leaveTypeId` langsung dari query.

        **`companyId` jangan dikirim.** `requireCompanyAccess()` menimpa
        `req.query.companyId` dengan company efektif sesi sebelum controller
        membacanya (`backend/src/shared/middleware/CompanyScope.ts:140-142`).
        Untuk karyawan dengan data scope `EMPLOYEE_SELF`, filter employee juga
        disuntikkan di middleware yang sama, sehingga daftar ini sudah
        tersaring ke pengajuan sendiri.

        Tidak ada pagination di endpoint ini: response memakai
        `Result.success`, bukan `Result.paginated`.
      parameters:
        - name: employeeId
          in: query
          required: false
          schema: { type: string }
          description: Tidak divalidasi skema. Dapat ditimpa oleh data-scope filter.
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Tidak divalidasi skema, tidak dibatasi enum.
        - name: leaveTypeId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [leave]
      operationId: leaveCreateRequest
      summary: Ajukan cuti
      description: |
        Sumber: `leave.routes.ts:141`, `leave.controller.ts:47-52`.
        **Permission: `leave:create`.**

        **Perhatikan urutan middleware.** `validate(createLeaveRequestSchema)`
        berjalan **sebelum** controller, dan skema itu
        (`leave.dto.ts:14-22`) mewajibkan `employeeId` **dan** `companyId`
        sebagai UUID. Jadi aplikasi harus mengirim keduanya walaupun server
        kemudian menimpanya:

        - `companyId` ditimpa oleh `requireCompanyAccess()` dengan company
          efektif sesi, dan nilai yang dikirim dicek lebih dulu terhadap
          `companyScope` — nilai di luar scope dijawab `403 FORBIDDEN`
          (`CompanyScope.ts:47-49`, `143-150`).
        - `employeeId` ditimpa controller dengan `req.user.employeeId` bila
          sesi punya employee (`leave.controller.ts:49`).

        Ambil kedua nilai itu dari `GET /auth/me` (`data.employeeId`,
        `data.companyId`) dan kirim apa adanya.

        Lampiran: unggah lebih dulu lewat `POST /leave/attachments`, lalu
        kirim URL hasilnya di field `attachment`.

        Mendukung `Idempotency-Key`. Status sukses: `201`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLeaveRequest' }
            examples:
              cutiTahunan:
                value:
                  employeeId: 22222222-2222-2222-2222-222222222222
                  companyId: 33333333-3333-3333-3333-333333333333
                  leaveTypeId: 44444444-4444-4444-4444-444444444444
                  startDate: "2026-11-10T00:00:00.000Z"
                  endDate: "2026-11-12T00:00:00.000Z"
                  reason: Acara keluarga di luar kota
      responses:
        '201':
          description: Pengajuan dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: |
            `BAD_REQUEST` — aturan bisnis cuti ditolak di service (mis. saldo
            kurang, tanggal tumpang tindih, lampiran wajib untuk pengajuan
            mendekati tanggal cuti). Pesan server menjelaskan sebabnya.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /leave/balances/employee:
