name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 2553f89be1efa62eeb7b3aeea68fc9f80336ee54

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: git diff --exit-code -- pubspec.lock

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test

      - name: Analyze source
        run: flutter analyze

      - name: Verify release safety guards
        run: >-
          flutter test
          test/core/app_config_test.dart
          test/core/transport_configuration_test.dart
          test/features/safety/no_demo_ui_test.dart

      - name: Run test suite with coverage
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/failures
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Validate Android production build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release App Bundle
        run: >-
          flutter build appbundle --release
          --dart-define=APP_ENV=production
          --dart-define=BASE_URL=https://ci.invalid/api/v1
          --dart-define=ENABLE_LOGGING=false

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-appbundle-debug-signed-validation
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Validate iOS production build without signing
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS without signing
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=APP_ENV=production
          --dart-define=BASE_URL=https://ci.invalid/api/v1
          --dart-define=ENABLE_LOGGING=false

      - name: Upload iOS validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-unsigned-validation
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
